aid: aice
name: AICE
description: >-
  AICE is a defense-technology company building the next generation of
  underwater defense systems: autonomous swarms of modular marine drones that
  secure naval assets and coastal infrastructure against evolving underwater
  threats. Founded in 2026 by former NASA engineer Gregoire Chomette and
  European Robotics Champion Remi Bouteiller, the company is part of the Y
  Combinator Spring 2026 batch, is based in the San Francisco Bay Area with
  hardware manufactured in France, and applies swarm robotics and AI to
  surveillance, detection, and protection of critical subsea infrastructure.
  AICE currently ships hardware and does not publish a public API, SDK, or
  developer platform; this profile tracks the company for the API Evangelist
  network.
